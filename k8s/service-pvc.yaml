---
apiVersion: v1
kind: Service
metadata:
  name: mx-ui
  namespace: mx-ui
  labels:
    app: mx-ui
spec:
  type: LoadBalancer
  selector:
    app: mx-ui
  ports:
  - name: http
    port: 80
    targetPort: 8080
    protocol: TCP
  - name: https
    port: 443
    targetPort: 443
    protocol: TCP
  - name: port8081
    port: 8081
    targetPort: 8081
  - name: port8082
    port: 8082
    targetPort: 8082
  - name: port8083
    port: 8083
    targetPort: 8083
  - name: port8084
    port: 8084
    targetPort: 8084
  - name: port8085
    port: 8085
    targetPort: 8085
  - name: port8086
    port: 8086
    targetPort: 8086
  - name: port8087
    port: 8087
    targetPort: 8087
  - name: port8088
    port: 8088
    targetPort: 8088
  - name: port8089
    port: 8089
    targetPort: 8089

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mx-ui-pvc
  namespace: mx-ui
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: standard
  resources:
    requests:
      storage: 20Gi

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: mx-ui-hpa
  namespace: mx-ui
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: mx-ui
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
